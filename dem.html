<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Face Puzzle</title>
    <link rel="icon" type="image/x-icon" sizes="180x180" href="images/wbi.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.3.1675466867/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675469077/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; }
        .hidden { display: none !important; }
        .mode-card { transition: all 0.3s ease; cursor: pointer; }
        .mode-card-single { border-color: rgba(0, 255, 255, 0.4); }
        .mode-card-single:hover, .mode-card-single.selected { background-color: rgba(0, 255, 255, 0.1); border-color: #00FFFF; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); }
        .mode-card-multi { border-color: rgba(255, 0, 255, 0.4); }
        .mode-card-multi:hover, .mode-card-multi.selected { background-color: rgba(255, 0, 255, 0.1); border-color: #FF00FF; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3); }
        .btn-glow { box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); transition: transform 0.2s, box-shadow 0.2s; }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 255, 255, 1); }
        .diff-btn { cursor: pointer; transition: all 0.3s ease; }
        #diff-easy.selected { background-color: rgba(0, 255, 255, 0.2); border-color: #00FFFF; box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); }
        #diff-medium.selected { background-color: rgba(234, 179, 8, 0.2); border-color: #EAB308; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
        #diff-hard.selected { background-color: rgba(249, 115, 22, 0.2); border-color: #F97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
        #diff-intense.selected { background-color: rgba(239, 68, 68, 0.2); border-color: #EF4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <!-- UI Overlay (Main Menu) -->
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#050505]/90 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-5xl md:text-6xl font-tech font-black tracking-widest uppercase mb-12 drop-shadow-lg text-center">
            <span class="text-cyan-400 drop-shadow-[0_0_10px_rgba(0,255,255,0.8)]">CLOCK</span>
            <span class="text-pink-500 drop-shadow-[0_0_10px_rgba(255,0,255,0.8)]">IT!!</span><br>
        </h1>

        <div class="flex flex-col md:flex-row gap-6 mb-10">
            <div id="card-single" class="mode-card mode-card-single border-2 rounded-xl p-6 w-64 md:w-72 flex flex-col items-center text-center">
                <span class="font-tech font-bold text-lg text-cyan-400 mb-2">SINGLE PLAYER</span>
                <p class="text-gray-400 text-sm">Play alone!<br>Solve your face puzzle as fast as possible.</p>
            </div>
            <div id="card-multi" class="mode-card mode-card-multi border-2 rounded-xl p-6 w-64 md:w-72 flex flex-col items-center text-center">
                <span class="font-tech font-bold text-lg text-pink-500 mb-2">MULTIPLAYER</span>
                <p class="text-gray-400 text-sm">More fun with two players!<br>Whoever finishes first wins.</p>
            </div>
        </div>

        <div class="flex flex-col items-center mb-10">
            <p class="font-tech font-bold text-white mb-3 tracking-widest text-sm">DIFFICULTY:</p>
            <div class="flex flex-wrap justify-center gap-3 px-4">
                <button id="diff-easy" class="diff-btn font-tech font-bold border-2 border-cyan-400/40 text-cyan-400 hover:bg-cyan-400/10 px-5 py-2 rounded-full transition-all text-xs selected">EASY (2x2)</button>
                <button id="diff-medium" class="diff-btn font-tech font-bold border-2 border-yellow-400/40 text-yellow-400 hover:bg-yellow-400/10 px-5 py-2 rounded-full transition-all text-xs">MEDIUM (3x3)</button>
                <button id="diff-hard" class="diff-btn font-tech font-bold border-2 border-orange-500/40 text-orange-500 hover:bg-orange-500/10 px-5 py-2 rounded-full transition-all text-xs">HARD (4x4)</button>
                <button id="diff-intense" class="diff-btn font-tech font-bold border-2 border-red-500/40 text-red-500 hover:bg-red-500/10 px-5 py-2 rounded-full transition-all text-xs">INTENSE (5x5)</button>
            </div>
        </div>

        <div class="text-center mb-10">
            <p class="font-tech font-bold text-white mb-2 tracking-widest">RULES:</p>
            <p class="text-gray-300 text-sm md:text-base max-w-md mx-auto">
                Use your hands to screenshot your face.<br>
                Then arrange the puzzle pieces by pinching your fingers!
            </p>
        </div>

        <div class="flex flex-col gap-4 items-center">
            <button id="btn-start-cam" class="font-tech bg-white text-black font-extrabold text-lg px-12 py-3 rounded-full w-72 cursor-not-allowed" disabled>
                LOADING CAMERA...
            </button>
            <button id="btn-start-game" class="font-tech bg-gray-700 text-gray-400 font-extrabold text-lg px-12 py-3 rounded-full transition-all duration-300 w-72 cursor-not-allowed" disabled>
                Start Game
            </button>
        </div>
    </div>

    <!-- Win Screen Overlay -->
    <div id="win-screen" class="hidden absolute inset-0 z-[60] flex flex-col items-center justify-center bg-black/85 backdrop-blur-sm transition-opacity duration-500 px-4">
        <div id="win-card" class="flex flex-col items-center justify-center p-8 md:p-10 border-2 bg-[#0a0a0f]/90 backdrop-blur-md rounded-2xl transition-all max-w-lg w-full shadow-lg">
            <h2 id="win-title" class="font-tech text-4xl md:text-5xl font-black mb-6 tracking-wider uppercase text-center"></h2>
            <div class="p-2 border border-gray-600 bg-black rounded-lg mb-6 shadow-inner">
                <img id="win-image" class="w-56 h-56 md:w-72 md:h-72 object-cover rounded" alt="Puzzle Completed" />
            </div>
            <p id="win-time" class="font-tech text-2xl md:text-3xl font-bold mb-8 text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.8)]"></p>
            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                <button id="btn-retake-win" class="font-tech bg-cyan-400 text-black font-extrabold text-sm md:text-base px-6 py-3 rounded-full btn-glow flex-1 hover:bg-cyan-300 transition-all">
                    RESTART
                </button>
                <button id="btn-play-again" class="font-tech bg-white text-black font-extrabold text-sm md:text-base px-6 py-3 rounded-full btn-glow flex-1 hover:bg-gray-200 transition-all">
                    MENU
                </button>
            </div>
        </div>
    </div>

    <video id="webcam" autoplay playsinline class="hidden"></video>
    <canvas id="game-canvas"></canvas>
    <canvas id="win-canvas" class="pointer-events-none fixed inset-0 z-[70] hidden"></canvas>

    <div id="top-bar-controls" class="hidden fixed top-5 left-5 z-40 flex items-center gap-3">
        <button id="btn-back" class="font-tech bg-black/60 border-2 border-white/40 text-white font-bold px-4 py-2 rounded-full hover:bg-white/10 hover:border-white transition-all backdrop-blur-sm text-base tracking-widest">
            ←
        </button>
        <button id="btn-retake" class="font-tech bg-black/60 border-2 border-cyan-400/50 text-cyan-400 font-bold px-5 py-2 rounded-full hover:bg-cyan-400/20 hover:border-cyan-400 transition-all backdrop-blur-sm text-sm tracking-widest">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v6h6M20 20v-6h-6M20 9A8 8 0 006.34 5.34L4 7.66M4 15a8 8 0 0013.66 3.66L20 16.34"/>
    </svg>
</button>
    </div>

    <script>
        // --- GAME CONFIG & CONSTANTS ---
        const PINCH_CLOSE_RATIO = 0.35, PINCH_OPEN_RATIO = 0.55;
        const COUNTDOWN_SECONDS = 3, MATCH_COUNTDOWN_SECONDS = 3;
        const COLOR_P1 = "#00FFFF", COLOR_P2 = "#FF00FF";
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
            [13,17],[0,17],[17,18],[18,19],[19,20]
        ];

        // --- DOM & CANVAS ---
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });
        const uiLayer = document.getElementById('ui-layer');
        const winScreen = document.getElementById('win-screen');
        const cardSingle = document.getElementById('card-single');
        const cardMulti = document.getElementById('card-multi');
        const btnStartCam = document.getElementById('btn-start-cam');
        const btnStartGame = document.getElementById('btn-start-game');
        const winTitle = document.getElementById('win-title');
        const winCard = document.getElementById('win-card');
        const winImage = document.getElementById('win-image');
        const winTime = document.getElementById('win-time');
        const btnPlayAgain = document.getElementById('btn-play-again');
        const btnRetakeWin = document.getElementById('btn-retake-win');
        const btnBack = document.getElementById('btn-back');
        const btnRetake = document.getElementById('btn-retake');
        const topBarControls = document.getElementById('top-bar-controls');

        // --- GLOBAL STATE ---
        let selectedMode = null, isCameraOn = false, isPlaying = false;
        let players = [], globalWinner = null, gridSize = 2;
        let matchCountdownActive = false, matchCountdownStart = null, matchStarted = false;

        // --- CANVAS UTILITY HELPERS ---
        function drawText(text, x, y, size=24, color='#FFF', align='center', base='middle', blur=10) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = blur;
            ctx.font = `bold ${size}px 'Orbitron', sans-serif`;
            ctx.textAlign = align;
            ctx.textBaseline = base;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function strokeBox(x, y, w, h, color='#FFF', width=2, blur=10) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = blur;
            ctx.lineWidth = width;
            ctx.strokeRect(x, y, w, h);
            ctx.restore();
        }

        // --- WIN RIBBONS & AUDIO SYNTH ---
        const winCanvas = document.getElementById('win-canvas');
        const winCtx = winCanvas ? winCanvas.getContext('2d') : null;
        let winRibbons = [], winAnimationId = null;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            if (winCanvas) { winCanvas.width = window.innerWidth; winCanvas.height = window.innerHeight; }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class RibbonParticle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                const colors = ["#00FFFF", "#FF00FF", "#FFFF00", "#00FF66", "#FF3366", "#9933FF", "#FF9900", "#FFFFFF"];
                this.x = Math.random() * window.innerWidth;
                this.y = initial ? Math.random() * -window.innerHeight : -50 - Math.random() * 100;
                this.w = 8 + Math.random() * 12; this.h = 22 + Math.random() * 28;
                this.vx = (Math.random() - 0.5) * 2.5; this.vy = 3.2 + Math.random() * 4.2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotX = Math.random() * Math.PI * 2; this.rotY = Math.random() * Math.PI * 2; this.rotZ = Math.random() * Math.PI * 2;
                this.rotSpeedX = (Math.random() - 0.5) * 0.08; this.rotSpeedY = (Math.random() - 0.5) * 0.08; this.rotSpeedZ = (Math.random() - 0.5) * 0.05;
                this.swaySpeed = 0.03 + Math.random() * 0.04; this.swayPhase = Math.random() * Math.PI * 2;
                this.isRibbon = Math.random() > 0.25;
            }
            update() {
                this.swayPhase += this.swaySpeed;
                this.x += this.vx + Math.sin(this.swayPhase) * 1.5; this.y += this.vy;
                this.rotX += this.rotSpeedX; this.rotY += this.rotSpeedY; this.rotZ += this.rotSpeedZ;
                if (this.y > window.innerHeight + 60) this.reset(false);
            }
            draw(c) {
                c.save(); c.translate(this.x, this.y); c.rotate(this.rotZ);
                c.scale(Math.cos(this.rotY), Math.sin(this.rotX));
                c.fillStyle = this.color; c.shadowColor = this.color; c.shadowBlur = 8;
                if (this.isRibbon) {
                    c.beginPath(); c.moveTo(-this.w/2, -this.h/2);
                    c.quadraticCurveTo(this.w, 0, -this.w/2, this.h/2); c.lineTo(this.w/2, this.h/2);
                    c.quadraticCurveTo(-this.w, 0, this.w/2, -this.h/2); c.closePath(); c.fill();
                } else { c.fillRect(-this.w/2, -this.h/2, this.w, this.h); }
                c.restore();
            }
        }

        function startWinRibbons() {
            if (!winCanvas || !winCtx) return;
            resizeCanvas(); winRibbons = [];
            for (let i = 0; i < 160; i++) winRibbons.push(new RibbonParticle());
            winCanvas.classList.remove('hidden');
            if (winAnimationId) cancelAnimationFrame(winAnimationId);
            function loop() {
                winCtx.clearRect(0, 0, winCanvas.width, winCanvas.height);
                winRibbons.forEach(p => { p.update(); p.draw(winCtx); });
                winAnimationId = requestAnimationFrame(loop);
            }
            loop();
        }

        function stopWinRibbons() {
            if (winAnimationId) { cancelAnimationFrame(winAnimationId); winAnimationId = null; }
            if (winCanvas && winCtx) { winCtx.clearRect(0, 0, winCanvas.width, winCanvas.height); winCanvas.classList.add('hidden'); }
        }

        function playWinSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const notes = [
                    { f: 261.63, t: 0.00, d: 0.14 }, { f: 329.63, t: 0.12, d: 0.14 },
                    { f: 392.00, t: 0.24, d: 0.14 }, { f: 523.25, t: 0.36, d: 0.25 },
                    { f: 659.25, t: 0.58, d: 0.20 }, { f: 783.99, t: 0.76, d: 0.75 }
                ];
                notes.forEach(n => {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + n.t);
                    gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + n.t + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + n.t); osc.stop(audioCtx.currentTime + n.t + n.d);
                });
            } catch (err) { console.warn("Audio error:", err); }
        }

        // --- MENU LOGIC ---
        function updateMenuUI() {
            cardSingle.classList.toggle('selected', selectedMode === 'single');
            cardMulti.classList.toggle('selected', selectedMode === 'multi');
            if (isCameraOn && selectedMode) {
                btnStartGame.classList.remove('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                btnStartGame.classList.add('bg-white', 'text-black', 'btn-glow', 'cursor-pointer');
                btnStartGame.disabled = false;
            } else {
                btnStartGame.classList.add('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                btnStartGame.classList.remove('bg-white', 'text-black', 'btn-glow', 'cursor-pointer');
                btnStartGame.disabled = true;
            }
        }

        cardSingle.addEventListener('click', () => { selectedMode = 'single'; updateMenuUI(); });
        cardMulti.addEventListener('click', () => { selectedMode = 'multi'; updateMenuUI(); });

        const diffButtons = { 2: document.getElementById('diff-easy'), 3: document.getElementById('diff-medium'), 4: document.getElementById('diff-hard'), 5: document.getElementById('diff-intense') };
        Object.keys(diffButtons).forEach(size => {
            diffButtons[size].addEventListener('click', () => {
                gridSize = parseInt(size);
                Object.values(diffButtons).forEach(b => b.classList.remove('selected'));
                diffButtons[size].classList.add('selected');
            });
        });

        btnStartCam.addEventListener('click', () => {
            if (!isCameraOn) {
                btnStartCam.innerText = "LOADING CAMERA...";
                btnStartCam.disabled = true;
                camera.start().catch(err => {
                    btnStartCam.innerText = "ALLOW CAMERA ACCESS";
                    btnStartCam.disabled = false;
                    btnStartCam.classList.add('btn-glow');
                });
            }
        });

        function cameraReady() {
            if (!isCameraOn) {
                isCameraOn = true;
                btnStartCam.innerText = "CAMERA ACTIVE";
                btnStartCam.classList.remove('bg-white', 'text-black');
                btnStartCam.classList.add('bg-transparent', 'text-cyan-400', 'border', 'border-cyan-400');
                btnStartCam.disabled = true;
                updateMenuUI();
            }
        }

        btnStartGame.addEventListener('click', () => {
            if (isCameraOn && selectedMode) {
                uiLayer.classList.add('hidden');
                if (topBarControls) topBarControls.classList.remove('hidden');
                players = [];
                if (selectedMode === 'single') {
                    players.push(new Player(1, { x: 0, y: 0, w: canvasElement.width, h: canvasElement.height }, COLOR_P1));
                } else {
                    let halfW = canvasElement.width / 2;
                    players.push(new Player(1, { x: 0, y: 0, w: halfW, h: canvasElement.height }, COLOR_P1));
                    players.push(new Player(2, { x: halfW, y: 0, w: halfW, h: canvasElement.height }, COLOR_P2));
                }
                globalWinner = null; matchCountdownActive = false; matchCountdownStart = null; matchStarted = false; isPlaying = true;
            }
        });

        function returnToMenu() {
            players.forEach(p => { if (p.intervalId) clearInterval(p.intervalId); });
            stopWinRibbons();
            winScreen.classList.add('hidden');
            if (topBarControls) topBarControls.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            selectedMode = null; isPlaying = false; players = []; globalWinner = null;
            matchCountdownActive = false; matchCountdownStart = null; matchStarted = false;
            updateMenuUI();
        }

        function triggerGlobalRetake() {
            stopWinRibbons(); winScreen.classList.add('hidden');
            if (!isPlaying && players.length > 0) { isPlaying = true; uiLayer.classList.add('hidden'); }
            if (topBarControls) topBarControls.classList.remove('hidden');
            players.forEach(p => p.retakePhoto());
            matchCountdownActive = false; matchCountdownStart = null; matchStarted = false;
        }

        btnPlayAgain.addEventListener('click', returnToMenu);
        btnBack.addEventListener('click', returnToMenu);
        btnRetake.addEventListener('click', triggerGlobalRetake);
        btnRetakeWin.addEventListener('click', triggerGlobalRetake);

        function triggerWinScreen(winnerPlayer) {
            isPlaying = false;
            if (topBarControls) topBarControls.classList.add('hidden');
            stopWinRibbons(); startWinRibbons(); playWinSound();

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = winnerPlayer.box.w; tempCanvas.height = winnerPlayer.box.h;
            let tctx = tempCanvas.getContext('2d');
            winnerPlayer.pieces.forEach(p => {
                tctx.drawImage(p.image, p.drawX - winnerPlayer.box.x, p.drawY - winnerPlayer.box.y);
            });

            winImage.src = tempCanvas.toDataURL('image/png');
            winTime.innerText = `TIME: ${winnerPlayer.formatTime(winnerPlayer.elapsedTime)}`;

            if (selectedMode === 'multi') {
                winTitle.innerText = `PLAYER ${winnerPlayer.id} WINS!`;
                winTitle.style.color = winnerPlayer.color;
                winTitle.style.textShadow = `0 0 15px ${winnerPlayer.color}`;
                winCard.style.borderColor = winnerPlayer.color;
                winCard.style.boxShadow = `0 0 30px ${winnerPlayer.color}66`;
            } else {
                winTitle.innerText = `COMPLETED!`;
                winTitle.style.color = COLOR_P1;
                winTitle.style.textShadow = `0 0 15px ${COLOR_P1}`;
                winCard.style.borderColor = COLOR_P1;
                winCard.style.boxShadow = `0 0 30px ${COLOR_P1}66`;
            }
            winScreen.classList.remove('hidden');
        }

        // --- PLAYER CLASS ---
        class Player {
            constructor(id, bounds, color) {
                this.id = id; this.bounds = bounds; this.color = color;
                this.retakePhoto();
            }

            retakePhoto() {
                if (this.intervalId) clearInterval(this.intervalId);
                this.state = 'CALIBRATING'; this.box = null; this.pieces = []; this.slots = [];
                this.heldPieceIndex = -1; this.startTime = null; this.elapsedTime = 0; this.intervalId = null;
                this.isPinching = false; this.smoothedCursor = null; this.smoothedPinchDist = null;
                this.countdownBox = null; this.countdownStart = null; this.shuffleStartTime = null;
                this.afterShuffleState = null; this.referenceCanvas = null; this.showReference = true;
                this.toggleRect = null; this.lastToggleTime = 0;
                if (selectedMode === 'multi') { matchCountdownActive = false; matchCountdownStart = null; matchStarted = false; }
            }

            update(handsData) {
                if (this.state === 'CALIBRATING') this.handleCalibration(handsData);
                else if (this.state === 'COUNTDOWN') this.handleCountdown(handsData);
                else if (this.state === 'SHUFFLING') this.handleShuffleAnimation(handsData);
                else if (this.state === 'WAITING') this.drawWaiting();
                else if (this.state === 'READY_COUNTDOWN') this.handleReadyCountdown();
                else if (this.state === 'PLAYING') this.handleGameplay(handsData);
                else if (this.state === 'LOSE') this.drawWaiting(true);

                if (this.referenceCanvas && this.state !== 'CALIBRATING' && this.state !== 'COUNTDOWN') {
                    this.drawReferencePreview(handsData);
                }
            }

            getHandScale(hand) { return this.getDistance(hand[0], hand[9]); }
            getPinchDistance(hand) {
                let raw = this.getDistance(hand[4], hand[8]);
                this.smoothedPinchDist = (this.smoothedPinchDist === null) ? raw : this.smoothedPinchDist + (raw - this.smoothedPinchDist) * 0.35;
                return this.smoothedPinchDist;
            }

            handleCalibration(handsData) {
                let msgX = this.bounds.x + this.bounds.w / 2;
                drawText(`PLAYER ${this.id}: Raise Both Hands`, msgX, 60, 28, this.color);
                drawText(`Stretch index finger & thumb to make a box.`, msgX, 95, 20, '#FFF', 'center', 'top', 5);
                drawText(`Pinch both to take a photo!`, msgX, 125, 20, '#FFF', 'center', 'top', 5);

                if (handsData.length >= 2) {
                    let hA = handsData[0], hB = handsData[1];
                    let leftHand = hA[0].x < hB[0].x ? hA : hB;
                    let rightHand = hA[0].x < hB[0].x ? hB : hA;
                    let pLeftThumb = leftHand[4], pRightIndex = rightHand[8];
                    let left = Math.min(pLeftThumb.x, pRightIndex.x), right = Math.max(pLeftThumb.x, pRightIndex.x);
                    let top = Math.min(pLeftThumb.y, pRightIndex.y), bottom = Math.max(pLeftThumb.y, pRightIndex.y);
                    let w = right - left, h = bottom - top;

                    if (w > 50 && h > 50) {
                        this.box = { x: left, y: top, w, h };
                        strokeBox(this.box.x, this.box.y, this.box.w, this.box.h, 'white', 4, 15);

                        let leftScale = this.getHandScale(leftHand), rightScale = this.getHandScale(rightHand);
                        let pinchLeft = this.getDistance(leftHand[4], leftHand[8]) < leftScale * PINCH_CLOSE_RATIO;
                        let pinchRight = this.getDistance(rightHand[4], rightHand[8]) < rightScale * PINCH_CLOSE_RATIO;

                        if (pinchLeft && pinchRight) this.startCountdown();
                    }
                }
            }

            startCountdown() {
                this.state = 'COUNTDOWN';
                this.countdownBox = { x: this.box.x, y: this.box.y, w: this.box.w, h: this.box.h };
                this.countdownStart = Date.now();
            }

            handleCountdown() {
                strokeBox(this.countdownBox.x, this.countdownBox.y, this.countdownBox.w, this.countdownBox.h, 'white', 4, 15);
                let cx = this.countdownBox.x + this.countdownBox.w / 2, cy = this.countdownBox.y + this.countdownBox.h / 2;
                let elapsed = (Date.now() - this.countdownStart) / 1000;
                let remaining = COUNTDOWN_SECONDS - Math.floor(elapsed);

                if (remaining <= 0) { this.box = this.countdownBox; this.capturePuzzle(); return; }
                drawText("HOLD YOUR POSE!", cx, Math.max(this.countdownBox.y - 20, 40), 26, this.color);
                drawText(remaining.toString(), cx, cy, 130, this.color, 'center', 'middle', 25);
            }

            capturePuzzle() {
                let imageData = ctx.getImageData(this.box.x, this.box.y, this.box.w, this.box.h);
                let tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.box.w; tempCanvas.height = this.box.h;
                tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

                this.referenceCanvas = tempCanvas; this.showReference = true;
                let pieceW = this.box.w / gridSize, pieceH = this.box.h / gridSize;
                this.pieces = []; this.slots = [];
                let totalPieces = gridSize * gridSize;

                for (let i = 0; i < totalPieces; i++) {
                    let row = Math.floor(i / gridSize), col = i % gridSize;
                    let pX = this.box.x + col * pieceW, pY = this.box.y + row * pieceH;
                    this.slots.push({ x: pX, y: pY, w: pieceW, h: pieceH });

                    let pieceCanvas = document.createElement('canvas');
                    pieceCanvas.width = pieceW; pieceCanvas.height = pieceH;
                    pieceCanvas.getContext('2d').drawImage(tempCanvas, col*pieceW, row*pieceH, pieceW, pieceH, 0, 0, pieceW, pieceH);
                    this.pieces.push({ id: i, currentSlot: i, image: pieceCanvas, drawX: pX, drawY: pY });
                }
                this.afterShuffleState = (selectedMode === 'multi') ? 'WAITING' : 'PLAYING';
                this.shufflePuzzle();
            }

            drawReferencePreview(handsData) {
                if (!this.referenceCanvas) return;
                const previewSize = 105, headerH = 22, padding = 5, topMargin = 15;
                const centerX = this.bounds.x + this.bounds.w / 2;
                let boxX, boxY, boxW, boxH;

                if (this.showReference) {
                    boxW = previewSize + padding * 2; boxH = previewSize + headerH + padding * 2;
                    boxX = centerX - boxW / 2; boxY = topMargin;
                } else {
                    boxW = 120; boxH = 26; boxX = centerX - boxW / 2; boxY = topMargin;
                }
                this.toggleRect = { x: boxX, y: boxY, w: boxW, h: boxH };

                ctx.save();
                ctx.fillStyle = "rgba(10, 10, 15, 0.88)"; ctx.strokeStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 10; ctx.lineWidth = 2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, this.showReference ? 8 : 13);
                else ctx.rect(boxX, boxY, boxW, boxH);
                ctx.fill(); ctx.stroke();

                if (this.showReference) {
                    drawText("TARGET FACE", boxX + padding + 2, boxY + headerH / 2 + 1, 11, this.color, 'left', 'middle', 0);
                    drawText("👁", boxX + boxW - padding - 2, boxY + headerH / 2 + 1, 14, '#FFF', 'right', 'middle', 0);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(boxX + 2, boxY + headerH); ctx.lineTo(boxX + boxW - 2, boxY + headerH); ctx.stroke();
                    const imgX = boxX + padding, imgY = boxY + headerH + padding;
                    ctx.drawImage(this.referenceCanvas, imgX, imgY, previewSize, previewSize);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; ctx.strokeRect(imgX, imgY, previewSize, previewSize);
                } else {
                    drawText("TARGET 👁 SHOW", boxX + boxW / 2, boxY + boxH / 2 + 1, 11, '#FFF', 'center', 'middle', 0);
                }
                ctx.restore();

                if (handsData && handsData.length > 0) {
                    handsData.forEach(h => {
                        let fingerTip = h[8], handScale = this.getHandScale(h);
                        let isPinching = this.getDistance(h[4], h[8]) < handScale * PINCH_CLOSE_RATIO;
                        if (fingerTip.x >= boxX && fingerTip.x <= boxX + boxW && fingerTip.y >= boxY && fingerTip.y <= boxY + boxH) {
                            strokeBox(boxX - 2, boxY - 2, boxW + 4, boxH + 4, '#FFF', 2, 12);
                            const now = Date.now();
                            if (isPinching && (now - this.lastToggleTime > 400)) {
                                this.showReference = !this.showReference; this.lastToggleTime = now;
                            }
                        }
                    });
                }
            }

            shufflePuzzle() {
                let slotIndices = Array.from({length: gridSize * gridSize}, (_, i) => i);
                for (let i = slotIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [slotIndices[i], slotIndices[j]] = [slotIndices[j], slotIndices[i]];
                }
                this.pieces.forEach((p, index) => {
                    p.startX = p.drawX; p.startY = p.drawY;
                    p.currentSlot = slotIndices[index];
                    let target = this.slots[p.currentSlot];
                    p.targetX = target.x; p.targetY = target.y;
                });
                this.state = 'SHUFFLING'; this.shuffleStartTime = Date.now();
            }

            handleShuffleAnimation() {
                strokeBox(0,0,0,0); // Reset
                ctx.save(); ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 1;
                this.slots.forEach(s => ctx.strokeRect(s.x, s.y, s.w, s.h)); ctx.restore();

                let elapsed = Date.now() - this.shuffleStartTime;
                let t = Math.min(elapsed / 900, 1);
                let eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                let oneMinusT = 1 - eased;
                let boxCx = this.box.x + this.box.w / 2, boxCy = this.box.y + this.box.h / 2;

                this.pieces.forEach(p => {
                    let straightMidX = (p.startX + p.targetX) / 2, straightMidY = (p.startY + p.targetY) / 2;
                    let curveX = straightMidX + (boxCx - straightMidX) * 0.35;
                    let curveY = straightMidY + (boxCy - straightMidY) * 0.35;
                    p.drawX = oneMinusT * oneMinusT * p.startX + 2 * oneMinusT * eased * curveX + eased * eased * p.targetX;
                    p.drawY = oneMinusT * oneMinusT * p.startY + 2 * oneMinusT * eased * curveY + eased * eased * p.targetY;
                    ctx.save(); ctx.globalAlpha = 0.8 + 0.2 * eased; ctx.drawImage(p.image, p.drawX, p.drawY);
                    strokeBox(p.drawX, p.drawY, p.image.width, p.image.height, this.color, 2, 8);
                    ctx.restore();
                });
                drawText("SHUFFLING...", this.bounds.x + this.bounds.w - 30, 45, 22, this.color, 'right', 'top');

                if (t >= 1) {
                    this.pieces.forEach(p => { p.drawX = p.targetX; p.drawY = p.targetY; });
                    if (this.afterShuffleState === 'WAITING') this.state = 'WAITING';
                    else this.startPlaying();
                }
            }

            startPlaying() {
                this.state = 'PLAYING'; this.startTime = Date.now();
                this.intervalId = setInterval(() => {
                    this.elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                }, 1000);
            }

            snapToSlot(piece) {
                let slot = this.slots[piece.currentSlot];
                piece.drawX = slot.x; piece.drawY = slot.y;
            }

            drawWaiting(isLose = false) {
                this.pieces.forEach(p => {
                    ctx.drawImage(p.image, p.drawX, p.drawY);
                    strokeBox(p.drawX, p.drawY, p.image.width, p.image.height, "rgba(255, 255, 255, 0.2)", 1, 0);
                });
                if (!isLose) drawText("Waiting for opponent...", this.bounds.x + this.bounds.w - 30, 45, 22, this.color, 'right', 'top');
            }

            handleReadyCountdown() {
                this.drawWaiting(true);
                let cx = this.bounds.x + this.bounds.w / 2, cy = this.bounds.y + this.bounds.h / 2;
                let elapsed = (Date.now() - matchCountdownStart) / 1000;
                let remaining = MATCH_COUNTDOWN_SECONDS - Math.floor(elapsed);
                drawText("GET SET!", this.bounds.x + this.bounds.w - 30, 45, 22, this.color, 'right', 'top');
                drawText(remaining > 0 ? remaining.toString() : "GO!", cx, cy, 130, this.color, 'center', 'middle', 25);
            }

            handleGameplay(handsData) {
                ctx.save(); ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 1;
                this.slots.forEach(s => ctx.strokeRect(s.x, s.y, s.w, s.h)); ctx.restore();

                let cursor = null, pinching = false;
                if (handsData.length > 0) {
                    let h = handsData[0];
                    let rawX = (h[4].x + h[8].x)/2, rawY = (h[4].y + h[8].y)/2;
                    if (!this.smoothedCursor) this.smoothedCursor = { x: rawX, y: rawY };
                    else {
                        this.smoothedCursor.x += (rawX - this.smoothedCursor.x) * 0.25;
                        this.smoothedCursor.y += (rawY - this.smoothedCursor.y) * 0.25;
                    }
                    cursor = this.smoothedCursor;

                    let pinchDist = this.getPinchDistance(h), handScale = this.getHandScale(h);
                    pinching = this.isPinching ? (pinchDist < handScale * PINCH_OPEN_RATIO) : (pinchDist < handScale * PINCH_CLOSE_RATIO);

                    ctx.save();
                    let pulse = pinching ? Math.abs(Math.sin(Date.now() / 120)) * 6 : 0;
                    let radius = pinching ? 12 + pulse : 8;
                    ctx.fillStyle = pinching ? this.color : "rgba(255, 255, 255, 0.8)";
                    ctx.shadowColor = pinching ? this.color : "white"; ctx.shadowBlur = pinching ? 20 + pulse * 2 : 10;
                    if (pinching) {
                        ctx.strokeStyle = this.color; ctx.lineWidth = 4 + pulse/2;
                        ctx.beginPath(); ctx.moveTo(h[4].x, h[4].y); ctx.lineTo(h[8].x, h[8].y); ctx.stroke();
                        ctx.beginPath(); ctx.arc(cursor.x, cursor.y, radius + 10, 0, Math.PI*2); ctx.lineWidth = 2; ctx.stroke();
                    }
                    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
                } else { this.smoothedCursor = null; }

                if (pinching && !this.isPinching) {
                    this.isPinching = true;
                    if (cursor && this.heldPieceIndex === -1) {
                        for (let i = 0; i < this.pieces.length; i++) {
                            let p = this.pieces[i], slot = this.slots[p.currentSlot];
                            if (cursor.x >= slot.x && cursor.x <= slot.x + slot.w && cursor.y >= slot.y && cursor.y <= slot.y + slot.h) {
                                this.heldPieceIndex = i; break;
                            }
                        }
                    }
                } else if (pinching && this.isPinching) {
                    if (this.heldPieceIndex !== -1 && cursor) {
                        let p = this.pieces[this.heldPieceIndex];
                        p.drawX = cursor.x - this.slots[0].w/2; p.drawY = cursor.y - this.slots[0].h/2;
                    }
                } else if (!pinching && this.isPinching) {
                    this.isPinching = false;
                    if (this.heldPieceIndex !== -1 && cursor) {
                        let heldPiece = this.pieces[this.heldPieceIndex], targetSlotIndex = -1, minDist = Infinity;
                        for (let i = 0; i < this.slots.length; i++) {
                            let slot = this.slots[i], dist = this.getDistance(cursor, {x: slot.x + slot.w/2, y: slot.y + slot.h/2});
                            if (dist < minDist) { minDist = dist; targetSlotIndex = i; }
                        }
                        if (targetSlotIndex !== -1 && targetSlotIndex !== heldPiece.currentSlot) {
                            let pieceInTarget = this.pieces.find(p => p.currentSlot === targetSlotIndex);
                            if (pieceInTarget) { pieceInTarget.currentSlot = heldPiece.currentSlot; this.snapToSlot(pieceInTarget); }
                            heldPiece.currentSlot = targetSlotIndex;
                        }
                        this.snapToSlot(heldPiece); this.heldPieceIndex = -1; this.checkWin();
                    }
                }

                this.pieces.forEach((p, idx) => {
                    if (idx !== this.heldPieceIndex) {
                        ctx.drawImage(p.image, p.drawX, p.drawY);
                        strokeBox(p.drawX, p.drawY, p.image.width, p.image.height, "#222", 1, 0);
                    }
                });

                if (this.heldPieceIndex !== -1) {
                    let p = this.pieces[this.heldPieceIndex];
                    ctx.globalAlpha = 0.85; ctx.drawImage(p.image, p.drawX, p.drawY); ctx.globalAlpha = 1.0;
                    strokeBox(p.drawX, p.drawY, p.image.width, p.image.height, this.color, 4, 15);
                }

                drawText(`TIME: ${this.formatTime(this.elapsedTime)}`, this.bounds.x + this.bounds.w - 30, 45, 32, this.color, 'right', 'top', 15);
            }

            checkWin() {
                if (this.pieces.every(p => p.id === p.currentSlot) && this.state !== 'SOLVED') {
                    this.state = 'SOLVED'; clearInterval(this.intervalId);
                    if (selectedMode === 'multi') {
                        let loser = players.find(x => x.id !== this.id);
                        if (loser) { loser.state = 'LOSE'; clearInterval(loser.intervalId); }
                    }
                    triggerWinScreen(this);
                }
            }

            getDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }
            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`; }
        }

        // --- HAND SKELETON DRAWING ---
        function drawSkeleton(landmarks, color) {
            ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.lineWidth = 3;
            HAND_CONNECTIONS.forEach(conn => {
                const p1 = landmarks[conn[0]], p2 = landmarks[conn[1]];
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            });
            landmarks.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 2*Math.PI); ctx.fill(); });
            ctx.restore();
        }

        // --- MEDIAPIPE CORE ---
        function onResults(results) {
            cameraReady();
            ctx.save(); ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const canvasRatio = canvasElement.width / canvasElement.height;
            const videoRatio = results.image.width / results.image.height;
            let dw, dh, dx, dy;

            if (canvasRatio > videoRatio) {
                dw = canvasElement.width; dh = canvasElement.width / videoRatio; dx = 0; dy = (canvasElement.height - dh) / 2;
            } else {
                dw = canvasElement.height * videoRatio; dh = canvasElement.height; dx = (canvasElement.width - dw) / 2; dy = 0;
            }

            ctx.translate(canvasElement.width, 0); ctx.scale(-1, 1);
            ctx.filter = "brightness(0.5)"; ctx.drawImage(results.image, dx, dy, dw, dh);
            ctx.filter = "none"; ctx.restore();

            let mappedHands = [];
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    mappedHands.push(landmarks.map(lm => ({ x: canvasElement.width - (lm.x * dw + dx), y: lm.y * dh + dy, z: lm.z })));
                }
            }

            if (isPlaying && players.length > 0) {
                if (selectedMode === 'multi') {
                    const midX = canvasElement.width / 2;
                    ctx.save(); ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.shadowColor = "white"; ctx.shadowBlur = 14; ctx.lineWidth = 3;
                    ctx.setLineDash([12, 8]); ctx.beginPath(); ctx.moveTo(midX, 0); ctx.lineTo(midX, canvasElement.height); ctx.stroke(); ctx.setLineDash([]); ctx.restore();

                    const badgeW = 230, badgeH = 30, badgeY = canvasElement.height - 50;
                    ctx.save(); ctx.fillStyle = "rgba(10, 10, 15, 0.92)"; ctx.strokeStyle = "rgba(255, 255, 255, 0.7)"; ctx.shadowColor = "white"; ctx.shadowBlur = 12; ctx.lineWidth = 2;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(midX - badgeW / 2, badgeY, badgeW, badgeH, 15);
                    else ctx.rect(midX - badgeW / 2, badgeY, badgeW, badgeH);
                    ctx.fill(); ctx.stroke();
                    drawText("DO NOT CROSS THIS LINE", midX, badgeY + badgeH / 2 + 1, 11, "#FFFFFF", 'center', 'middle', 8);
                    ctx.restore();
                }

                let p1Hands = [], p2Hands = [];
                if (selectedMode === 'single') p1Hands = mappedHands;
                else if (selectedMode === 'multi') {
                    mappedHands.forEach(hand => {
                        let avgX = hand.reduce((sum, lm) => sum + lm.x, 0) / hand.length;
                        if (avgX < canvasElement.width / 2) p1Hands.push(hand); else p2Hands.push(hand);
                    });
                }

                if (selectedMode === 'multi' && players.length === 2) {
                    let bothWaiting = players.every(p => p.state === 'WAITING');
                    if (bothWaiting && !matchCountdownActive && !matchStarted) {
                        matchCountdownActive = true; matchCountdownStart = Date.now();
                        players.forEach(p => { p.state = 'READY_COUNTDOWN'; });
                    }
                    if (matchCountdownActive) {
                        let elapsed = (Date.now() - matchCountdownStart) / 1000;
                        if (elapsed >= MATCH_COUNTDOWN_SECONDS + 0.5) {
                            matchCountdownActive = false; matchStarted = true; players.forEach(p => p.startPlaying());
                        }
                    }
                }

                if (players[0]) players[0].update(p1Hands);
                if (players[1]) players[1].update(p2Hands);
            }

            if (isPlaying && players.length > 0) {
                if (selectedMode === 'single') mappedHands.forEach(hand => drawSkeleton(hand, COLOR_P1));
                else mappedHands.forEach(hand => drawSkeleton(hand, (hand.reduce((s, l) => s + l.x, 0) / hand.length < canvasElement.width / 2) ? COLOR_P1 : COLOR_P2));
            } else {
                mappedHands.forEach(hand => drawSkeleton(hand, "#FFFFFF"));
            }
        }

        canvasElement.addEventListener('click', (e) => {
            const rect = canvasElement.getBoundingClientRect();
            const clickX = e.clientX - rect.left, clickY = e.clientY - rect.top;
            players.forEach(p => {
                if (p.toggleRect) {
                    let tr = p.toggleRect;
                    if (clickX >= tr.x && clickX <= tr.x + tr.w && clickY >= tr.y && clickY <= tr.y + tr.h) p.showReference = !p.showReference;
                }
            });
        });

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 360
        });

        let loadingSteps = ["REQUESTING WEBCAM...", "DOWNLOADING DETECTOR...", "COMPILING WEB-ASSEMBLY...", "STARTING INFERENCE..."];
        let stepIdx = 0; btnStartCam.innerText = loadingSteps[0];
        let loadingInterval = setInterval(() => {
            if (isCameraOn) { clearInterval(loadingInterval); return; }
            stepIdx = Math.min(stepIdx + 1, loadingSteps.length - 1);
            btnStartCam.innerText = loadingSteps[stepIdx];
        }, 2500);

        camera.start().catch(err => {
            clearInterval(loadingInterval);
            console.error("Camera auto-start failed:", err);
            btnStartCam.innerText = "ALLOW CAMERA ACCESS";
            btnStartCam.disabled = false;
            btnStartCam.classList.add('btn-glow');
        });
    </script>
</body>
</html>
